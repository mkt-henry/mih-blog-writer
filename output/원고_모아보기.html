<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원고 모아보기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --line: #d9dee7;
      --brand: #2454a6;
      --brand-soft: #e7eefc;
      --shadow: 0 10px 28px rgba(24, 32, 56, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 24px;
      overflow: auto;
      max-height: 100vh;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .meta a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    .count {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      background: #fbfcff;
    }

    .count strong {
      display: block;
      color: var(--brand);
      font-size: 20px;
      line-height: 1.1;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }

    .search:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(36, 84, 166, 0.14);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .tab {
      flex: 1 0 110px;
      height: 36px;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab.active {
      background: var(--brand);
      color: #ffffff;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .item:hover,
    .item.active {
      border-color: var(--brand);
      background: #fbfdff;
      box-shadow: 0 6px 18px rgba(36, 84, 166, 0.1);
    }

    .item-title {
      display: block;
      margin-bottom: 6px;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }

    .empty {
      display: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      background: #ffffff;
      font-size: 14px;
    }

    .viewer {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .viewer-title {
      min-width: 0;
    }

    .viewer-title strong {
      display: block;
      font-size: 16px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: #1f2937;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .frame-wrap {
      padding: 20px;
      min-height: 0;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 112px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .viewer {
        min-height: 70vh;
      }

      iframe {
        height: 70vh;
      }
    }

    @media (max-width: 640px) {
      .sidebar,
      .frame-wrap {
        padding: 16px;
      }

      .header,
      .viewer-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .action {
        flex: 1;
      }

      .viewer-title strong,
      .viewer-title span {
        white-space: normal;
      }
    }
  </style>
</head>

    <aside class="sidebar">
      <div class="header">
        <div>
          <h1>원고 모아보기</h1>
          <p class="meta">원본 HTML 파일은 그대로 두고 목록에서 불러와 확인합니다.<br><a href="./발행_URL_리스트.html">날짜별 발행 URL만 보기</a></p>
        </div>
        <div class="count"><strong id="visibleCount">0</strong>개</div>
      </div>

      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="이름, 제목, 날짜로 검색">
        <div class="tabs source-tabs" role="tablist" aria-label="원고 출처">
          <button class="tab active" type="button" data-source="local">작성 원고</button>
          <button class="tab" type="button" data-source="published">발행 원고</button>
        </div>
        <div id="dateTabs" class="tabs" role="tablist" aria-label="원고 작성일">
          <button class="tab active" type="button" data-filter="all">전체</button>
        </div>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty">검색 결과가 없습니다.</div>
    </aside>

    <section class="viewer" aria-label="원고 미리보기">
      <div class="viewer-bar">
        <div class="viewer-title">
          <strong id="selectedTitle">원고를 선택하세요</strong>
          <span id="selectedPath">목록에서 파일을 선택하면 이 영역에 원본 HTML이 표시됩니다.</span>
        </div>
        <div class="actions">
          <button id="copyPath" class="action" type="button">경로 복사</button>
          <a id="openLink" class="action primary" href="#" target="_blank" rel="noopener">새 탭 열기</a>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe id="preview" title="원고 미리보기"></iframe>
      </div>
    </section>
  </main>

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const visibleCount = document.getElementById("visibleCount");
    const selectedTitle = document.getElementById("selectedTitle");
    const selectedPath = document.getElementById("selectedPath");
    const preview = document.getElementById("preview");
    const openLink = document.getElementById("openLink");
    const copyPath = document.getElementById("copyPath");
    const tabsRoot = document.getElementById("dateTabs");
    const sourceTabs = Array.from(document.querySelectorAll("[data-source]"));
    let tabs = [];

    let activeSource = "local";
    let activeFilter = "all";
    let selectedPathValue = "";

    function activeItems() {
      return activeSource === "published" ? publishedPosts : manuscripts;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function buildTabs() {
      tabsRoot.innerHTML = '<button class="tab active" type="button" data-filter="all">전체</button>';
      activeFilter = "all";
      const dates = [...new Set(activeItems().map((item) => item.date))].sort().reverse();
      dates.forEach((date) => {
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.dataset.filter = date;
        button.textContent = date;
        tabsRoot.appendChild(button);
      });
      tabs = Array.from(tabsRoot.querySelectorAll(".tab"));
      bindTabs();
    }

    function filteredItems() {
      const query = search.value.trim().toLowerCase();
      return activeItems().filter((item) => {
        const matchesFilter = activeFilter === "all" || item.date === activeFilter;
        const haystack = `${item.person || ""} ${item.title} ${item.date} ${item.publishedAt || ""} ${item.path || ""} ${item.url || ""}`.toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });
    }

    function selectItem(item) {
      const target = item.url || item.path;
      const displayTitle = item.url ? item.title : `${item.person} ${item.title}`;
      selectedPathValue = target;
      selectedTitle.textContent = displayTitle;
      selectedPath.textContent = item.url ? `${item.publishedAt} · ${item.url}` : item.path;
      openLink.href = target;
      openLink.textContent = item.url ? "블로그 열기" : "새 탭 열기";

      if (item.url) {
        preview.removeAttribute("src");
        preview.srcdoc = `
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <style>
              body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; background:#fff; color:#222; }
              main { max-width:760px; margin:0 auto; padding:48px 28px; line-height:1.7; }
              .badge { display:inline-block; margin-bottom:16px; padding:6px 10px; border-radius:999px; background:#e7eefc; color:#2454a6; font-weight:700; font-size:13px; }
              h1 { margin:0 0 16px; font-size:26px; line-height:1.35; letter-spacing:0; }
              p { margin:0 0 24px; color:#555; }
              a { display:inline-flex; align-items:center; justify-content:center; height:42px; padding:0 14px; border-radius:8px; background:#2454a6; color:#fff; text-decoration:none; font-weight:700; }
            </style>
          </head>
          <body>
            <main>
              <span class="badge">네이버 블로그 발행 원고 · ${escapeHtml(item.publishedAt)}</span>
              <h1>${escapeHtml(item.title)}</h1>
              <p>RSS에서 확인된 실제 발행 글입니다. 네이버 블로그 원문은 아래 버튼 또는 우측 상단의 블로그 열기 버튼으로 확인하세요.</p>
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">네이버 블로그에서 보기</a>
            </main>
          </body>
          </html>
        `;
      } else {
        preview.removeAttribute("srcdoc");
        preview.src = item.path;
      }

      Array.from(document.querySelectorAll(".item")).forEach((button) => {
        button.classList.toggle("active", button.dataset.path === target);
      });
    }

    function render() {
      const items = filteredItems();
      list.innerHTML = "";
      visibleCount.textContent = items.length;
      empty.style.display = items.length ? "none" : "block";

      items.forEach((item) => {
        const target = item.url || item.path;
        const displayTitle = item.url ? item.title : `${item.person} ${item.title}`;
        const displayPath = item.url ? item.url : item.path;
        const badge = item.url ? `발행 · ${item.publishedAt}` : item.date;
        const button = document.createElement("button");
        button.className = "item";
        button.type = "button";
        button.dataset.path = target;
        button.innerHTML = `
          <span class="item-title">${escapeHtml(displayTitle)}</span>
          <span class="item-meta">
            <span>${escapeHtml(displayPath)}</span>
            <span class="badge">${escapeHtml(badge)}</span>
          </span>
        `;
        button.addEventListener("click", () => selectItem(item));
        list.appendChild(button);
      });

      const stillVisible = items.some((item) => (item.url || item.path) === selectedPathValue);
      if (items.length && !stillVisible) {
        selectItem(items[0]);
      }
    }

    function bindTabs() {
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((button) => button.classList.remove("active"));
          tab.classList.add("active");
          activeFilter = tab.dataset.filter;
          render();
        });
      });
    }

    search.addEventListener("input", render);

    sourceTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        sourceTabs.forEach((button) => button.classList.remove("active"));
        tab.classList.add("active");
        activeSource = tab.dataset.source;
        selectedPathValue = "";
        buildTabs();
        render();
      });
    });

    copyPath.addEventListener("click", async () => {
      if (!selectedPathValue) return;
      const fullPath = selectedPathValue.startsWith("http") ? selectedPathValue : new URL(selectedPathValue, window.location.href).href;
      try {
        await navigator.clipboard.writeText(decodeURI(fullPath));
        copyPath.textContent = "복사됨";
        setTimeout(() => {
          copyPath.textContent = "경로 복사";
        }, 1200);
      } catch {
        window.prompt("아래 경로를 복사하세요.", decodeURI(fullPath));
      }
    });

    buildTabs();
    render();
  </script>
</body>
