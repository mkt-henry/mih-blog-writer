<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원고 모아보기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --line: #d9dee7;
      --brand: #2454a6;
      --brand-soft: #e7eefc;
      --shadow: 0 10px 28px rgba(24, 32, 56, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 24px;
      overflow: auto;
      max-height: 100vh;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .count {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      background: #fbfcff;
    }

    .count strong {
      display: block;
      color: var(--brand);
      font-size: 20px;
      line-height: 1.1;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }

    .search:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(36, 84, 166, 0.14);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .tab {
      height: 36px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab.active {
      background: var(--brand);
      color: #ffffff;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .item:hover,
    .item.active {
      border-color: var(--brand);
      background: #fbfdff;
      box-shadow: 0 6px 18px rgba(36, 84, 166, 0.1);
    }

    .item-title {
      display: block;
      margin-bottom: 6px;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }

    .empty {
      display: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      background: #ffffff;
      font-size: 14px;
    }

    .viewer {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .viewer-title {
      min-width: 0;
    }

    .viewer-title strong {
      display: block;
      font-size: 16px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: #1f2937;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .frame-wrap {
      padding: 20px;
      min-height: 0;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 112px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .viewer {
        min-height: 70vh;
      }

      iframe {
        height: 70vh;
      }
    }

    @media (max-width: 640px) {
      .sidebar,
      .frame-wrap {
        padding: 16px;
      }

      .header,
      .viewer-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .action {
        flex: 1;
      }

      .viewer-title strong,
      .viewer-title span {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="header">
        <div>
          <h1>원고 모아보기</h1>
          <p class="meta">원본 HTML 파일은 그대로 두고 목록에서 불러와 확인합니다.</p>
        </div>
        <div class="count"><strong id="visibleCount">0</strong>개</div>
      </div>

      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="이름, 제목, 분류로 검색">
        <div class="tabs" role="tablist" aria-label="원고 분류">
          <button class="tab active" type="button" data-filter="all">전체</button>
          <button class="tab" type="button" data-filter="current">현재</button>
          <button class="tab" type="button" data-filter="archive">아카이브</button>
        </div>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty">검색 결과가 없습니다.</div>
    </aside>

    <section class="viewer" aria-label="원고 미리보기">
      <div class="viewer-bar">
        <div class="viewer-title">
          <strong id="selectedTitle">원고를 선택하세요</strong>
          <span id="selectedPath">목록에서 파일을 선택하면 이 영역에 원본 HTML이 표시됩니다.</span>
        </div>
        <div class="actions">
          <button id="copyPath" class="action" type="button">경로 복사</button>
          <a id="openLink" class="action primary" href="#" target="_blank" rel="noopener">새 탭 열기</a>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe id="preview" title="원고 미리보기"></iframe>
      </div>
    </section>
  </main>

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const visibleCount = document.getElementById("visibleCount");
    const selectedTitle = document.getElementById("selectedTitle");
    const selectedPath = document.getElementById("selectedPath");
    const preview = document.getElementById("preview");
    const openLink = document.getElementById("openLink");
    const copyPath = document.getElementById("copyPath");
    const tabs = Array.from(document.querySelectorAll(".tab"));

    let activeFilter = "all";
    let selectedPathValue = "";

    function groupLabel(group) {
      return group === "archive" ? "아카이브" : "현재";
    }

    function filteredItems() {
      const query = search.value.trim().toLowerCase();
      return manuscripts.filter((item) => {
        const matchesFilter = activeFilter === "all" || item.group === activeFilter;
        const haystack = `${item.person} ${item.title} ${groupLabel(item.group)} ${item.path}`.toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });
    }

    function selectItem(item) {
      selectedPathValue = item.path;
      selectedTitle.textContent = `${item.person} ${item.title}`;
      selectedPath.textContent = item.path;
      preview.src = item.path;
      openLink.href = item.path;
      Array.from(document.querySelectorAll(".item")).forEach((button) => {
        button.classList.toggle("active", button.dataset.path === item.path);
      });
    }

    function render() {
      const items = filteredItems();
      list.innerHTML = "";
      visibleCount.textContent = items.length;
      empty.style.display = items.length ? "none" : "block";

      items.forEach((item) => {
        const button = document.createElement("button");
        button.className = "item";
        button.type = "button";
        button.dataset.path = item.path;
        button.innerHTML = `
          <span class="item-title">${item.person} ${item.title}</span>
          <span class="item-meta">
            <span>${item.path}</span>
            <span class="badge">${groupLabel(item.group)}</span>
          </span>
        `;
        button.addEventListener("click", () => selectItem(item));
        list.appendChild(button);
      });

      const stillVisible = items.some((item) => item.path === selectedPathValue);
      if (items.length && !stillVisible) {
        selectItem(items[0]);
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((button) => button.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        render();
      });
    });

    search.addEventListener("input", render);

    copyPath.addEventListener("click", async () => {
      if (!selectedPathValue) return;
      const fullPath = new URL(selectedPathValue, window.location.href).href;
      try {
        await navigator.clipboard.writeText(decodeURI(fullPath));
        copyPath.textContent = "복사됨";
        setTimeout(() => {
          copyPath.textContent = "경로 복사";
        }, 1200);
      } catch {
        window.prompt("아래 경로를 복사하세요.", decodeURI(fullPath));
      }
    });

    render();
  </script>
