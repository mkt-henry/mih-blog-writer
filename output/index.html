<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원고 모아보기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --line: #d9dee7;
      --brand: #2454a6;
      --brand-soft: #e7eefc;
      --shadow: 0 10px 28px rgba(24, 32, 56, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 24px;
      overflow: auto;
      max-height: 100vh;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .meta a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    .count {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      background: #fbfcff;
    }

    .count strong {
      display: block;
      color: var(--brand);
      font-size: 20px;
      line-height: 1.1;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }

    .search:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(36, 84, 166, 0.14);
    }

    .date-filter {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }

    .date-field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .date-field label {
      color: #374151;
      font-size: 11px;
      font-weight: 800;
    }

    .date-field input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 9px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      outline: none;
    }

    .date-field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(36, 84, 166, 0.12);
    }

    .quick-date-actions {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .quick-date-actions .action {
      height: 34px;
    }

    .quick-date-actions .action.active {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay[hidden] { display: none; }

    .modal {
      background: var(--panel);
      border-radius: 12px;
      width: 100%;
      max-width: 540px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .modal-title {
      font-weight: 700;
      font-size: 15px;
    }

    .modal-head-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .modal-list {
      overflow-y: auto;
      flex: 1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-post {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .modal-post-info {
      flex: 1;
      min-width: 0;
    }

    .modal-post-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .modal-post-title:hover { color: var(--brand); }

    .modal-post-date {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .modal-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .modal-foot .action { width: 100%; }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .item:hover,
    .item.active {
      border-color: var(--brand);
      background: #fbfdff;
      box-shadow: 0 6px 18px rgba(36, 84, 166, 0.1);
    }

    .item-title {
      display: block;
      margin-bottom: 6px;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }

    .empty {
      display: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      background: #ffffff;
      font-size: 14px;
    }

    .viewer {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .viewer-title {
      min-width: 0;
    }

    .viewer-title strong {
      display: block;
      font-size: 16px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: #1f2937;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .action:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .frame-wrap {
      padding: 20px;
      min-height: 0;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 112px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .viewer {
        min-height: 70vh;
      }

      iframe {
        height: 70vh;
      }
    }

    .agency-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .agency-tab {
      flex: 1;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .agency-tab.active {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .loading {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .history-tab {
      background: #f3f4f6 !important;
      color: #9ca3af !important;
    }

    .history-tab.active {
      border-color: #9ca3af !important;
      background: #e5e7eb !important;
      color: #6b7280 !important;
    }

    .draft-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
    }

    .draft-agency-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .draft-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .draft-tabs {
      display: flex;
      gap: 4px;
    }

    .draft-tab {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .draft-tab.active {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .draft-tab.history {
      background: #f3f4f6;
      color: #9ca3af;
    }

    .draft-tab.history.active {
      border-color: #9ca3af;
      background: #e5e7eb;
      color: #6b7280;
    }

    .draft-tab:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .config-field {
      display: grid;
      gap: 6px;
    }

    .config-field > label {
      font-size: 12px;
      font-weight: 800;
      color: #374151;
    }

    .config-field input[type="url"],
    .config-field input[type="number"],
    .config-field input[type="text"],
    .config-field input[type="file"] {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    .config-field input[type="file"] {
      padding: 7px 10px;
    }

    .config-field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(36, 84, 166, 0.14);
    }

    .config-preview {
      display: block;
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
    }

    .config-hint {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .config-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      background: #fbfcff;
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .config-card-head {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
    }

    .config-card-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: var(--brand);
    }

    .config-card-head .config-card-slug {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .config-card-fields {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .config-card-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 110px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 10px;
    }

    .config-card-status {
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
    }

    .config-card-status.ok { color: #047857; }
    .config-card-status.err { color: #b91c1c; }

    @media (max-width: 720px) {
      .config-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .sidebar,
      .frame-wrap {
        padding: 16px;
      }

      .header,
      .viewer-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .action {
        flex: 1;
      }

      .viewer-title strong,
      .viewer-title span {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="agency-tabs">
        <button class="agency-tab active" data-agency="mih_speaker">스피커</button>
        <button class="agency-tab" data-agency="mih_casting">캐스팅</button>
        <button class="agency-tab" data-agency="mih_agency">에이전시</button>
        <button class="agency-tab history-tab" data-agency="mih_history">이력</button>
      </div>
      <div class="header">
        <div>
          <h1>원고 모아보기</h1>
          <p class="meta" id="agencyLabel">메이드인헤븐 스피커</p>
        </div>
        <div class="count"><strong id="visibleCount">0</strong>개</div>
      </div>

      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="이름, 제목, 날짜로 검색">
        <div class="date-filter" aria-label="원고 일자 필터">
          <div class="date-field">
            <label for="startDateFilter">시작일</label>
            <input id="startDateFilter" type="date">
          </div>
          <div class="date-field">
            <label for="endDateFilter">종료일</label>
            <input id="endDateFilter" type="date">
          </div>
          <div class="quick-date-actions" aria-label="빠른 일자 필터">
            <button class="action" type="button" data-quick-date="today">오늘</button>
            <button class="action" type="button" data-quick-date="yesterday">전일</button>
            <button id="resetDateFilter" class="action" type="button">전체</button>
          </div>
        </div>
        <button id="showPublished" class="action primary" style="width:100%">발행 원고 목록 보기</button>
        <button id="showConfig" class="action" type="button" style="width:100%">⚙️ 계정 명함·CTA 설정</button>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty">검색 결과가 없습니다.</div>
    </aside>

    <section class="viewer" aria-label="원고 미리보기">
      <div class="viewer-bar">
        <div class="viewer-title">
          <strong id="selectedTitle">원고를 선택하세요</strong>
          <span id="selectedPath">목록에서 파일을 선택하면 이 영역에 원본 HTML이 표시됩니다.</span>
        </div>
        <div class="actions">
          <button id="copyPath" class="action" type="button">경로 복사</button>
          <a id="openLink" class="action primary" href="#" target="_blank" rel="noopener">새 탭 열기</a>
        </div>
      </div>
      <div id="draftBar" class="draft-bar" hidden>
        <div class="draft-agency-row">
          <span class="draft-label">업로드 계정</span>
          <div class="draft-tabs">
            <button class="draft-tab" data-draft-agency="mih_speaker" type="button">스피커</button>
            <button class="draft-tab" data-draft-agency="mih_casting" type="button">캐스팅</button>
            <button class="draft-tab" data-draft-agency="mih_agency" type="button">에이전시</button>
            <button class="draft-tab history" data-draft-agency="mih_history" type="button">이력</button>
          </div>
        </div>
        <div class="actions" style="gap:6px">
          <button id="copyBizCard" class="action" type="button" style="font-size:12px;height:32px">명함 복사</button>
          <button id="copyWriteUrl" class="action" type="button" style="font-size:12px;height:32px">URL 복사</button>
          <a id="openWrite" class="action primary" href="#" target="_blank" rel="noopener" style="font-size:12px;height:32px">글쓰기 열기</a>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe id="preview" title="원고 미리보기"></iframe>
      </div>
    </section>
  </main>

  <div id="configModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="configModalTitle" style="max-width: 760px;">
      <div class="modal-head">
        <span id="configModalTitle" class="modal-title">계정 명함·CTA 설정</span>
        <div class="modal-head-actions">
          <button id="closeConfigModal" class="action" type="button">✕</button>
        </div>
      </div>
      <div id="configList" class="modal-list" style="gap:14px"></div>
    </div>
  </div>

  <div id="publishedModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <span id="modalTitle" class="modal-title">발행 원고 목록</span>
        <div class="modal-head-actions">
          <button id="refreshRss" class="action" type="button">↻ 새로고침</button>
          <button id="closeModal" class="action" type="button">✕</button>
        </div>
      </div>
      <div id="modalList" class="modal-list"></div>
      <div class="modal-foot">
        <button id="copyModalUrls" class="action primary" type="button">선택 날짜 URL 모두 복사</button>
      </div>
    </div>
  </div>

  <script>
    const AGENCY_NAMES = { mih_speaker: "메이드인헤븐 스피커", mih_casting: "메이드인헤븐 캐스팅", mih_agency: "메이드인헤븐 에이전시", mih_history: "이전 발행 원고" };

    let manuscripts = [];
    let publishedPosts = [];
    let currentAgency = "mih_speaker";
    let loading = false;
    let selectedItem = null;
    let selectedDraftAgency = "mih_speaker";
    const agencyConfigCache = new Map();

    const _manuscripts = [

    function shouldOpenDirectly() {
      return window.matchMedia("(max-width: 980px)").matches;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function setDateRange(startDate, endDate, quickDate = "") {
      activeStartDate = startDate || "";
      activeEndDate = endDate || "";
      activeQuickDate = quickDate;
      startDateFilter.value = activeStartDate;
      endDateFilter.value = activeEndDate;
      quickDateButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.quickDate === activeQuickDate);
      });
    }

    function setTodayFilter() {
      const today = formatLocalDate(new Date());
      setDateRange(today, today, "today");
    }

    function selectedDateRange() {
      if (activeStartDate && activeEndDate && activeStartDate > activeEndDate) {
        return { startDate: activeEndDate, endDate: activeStartDate };
      }
      return { startDate: activeStartDate, endDate: activeEndDate };
    }

    function publishedItemsForSelectedDates() {
      const { startDate, endDate } = selectedDateRange();
      return publishedPosts.filter((item) => {
        const matchesStart = !startDate || item.date >= startDate;
        const matchesEnd = !endDate || item.date <= endDate;
        return matchesStart && matchesEnd && item.url;
      });
    }

    function filteredItems() {
      const query = search.value.trim().toLowerCase();
      const { startDate, endDate } = selectedDateRange();
      return manuscripts.filter((item) => {
        const matchesStart = !startDate || item.date >= startDate;
        const matchesEnd = !endDate || item.date <= endDate;
        const haystack = `${item.person || ""} ${item.title} ${item.date} ${item.publishedAt || ""} ${item.path || ""} ${item.url || ""}`.toLowerCase();
        return matchesStart && matchesEnd && (!query || haystack.includes(query));
      });
    }

    function draftApiUrl(filePath) {
      const p = String(filePath || "").replace(/^\.\//, "");
      return `/api/draft?path=${encodeURIComponent(p)}&agency=${encodeURIComponent(currentAgency)}`;

    function itemTarget(item) {
      return item.url || draftApiUrl(item.path || item.file_path);

        preview.removeAttribute("src");

    function render() {
      const items = filteredItems();
      list.innerHTML = "";
      visibleCount.textContent = items.length;
      empty.style.display = items.length ? "none" : "block";

      items.forEach((item) => {
        const target = itemTarget(item);
        const displayTitle = `${item.person} ${item.title}`;
        const displayPath = item.file_path || item.path;
        const badge = item.date;
        const button = document.createElement("button");
        button.className = "item";
        button.type = "button";
        button.dataset.path = target;
        button.innerHTML = `
          <span class="item-title">${escapeHtml(displayTitle)}</span>
          <span class="item-meta">
            <span>${escapeHtml(displayPath)}</span>
            <span class="badge">${escapeHtml(badge)}</span>
          </span>
        `;
        button.addEventListener("click", () => {
          if (shouldOpenDirectly()) {
            window.location.href = target;
            return;
          }
          selectItem(item);
        });
        list.appendChild(button);
      });

      const stillVisible = items.some((item) => itemTarget(item) === selectedPathValue);
      if (items.length && !stillVisible) {
        selectItem(items[0]);
      }
    }

    async function loadManuscripts(agency) {
      if (loading) return;
      loading = true;
      list.innerHTML = `<p class="loading">로딩 중...</p>`;
      visibleCount.textContent = "…";
      try {
        const res = await fetch(`/api/manuscripts?agency=${encodeURIComponent(agency)}`, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        manuscripts = data.map(m => ({
          date: m.date,
          person: m.slug,
          title: m.title,
          file_path: m.file_path,
          assigned_agency: agency
        }));
      } catch {
        manuscripts = _manuscripts.map(m => ({ ...m, assigned_agency: agency }));
      } finally {
        loading = false;
        render();
      }
    }

    async function loadPosts(agency) {
      try {
        const res = await fetch(`/api/posts?agency=${encodeURIComponent(agency)}`, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        publishedPosts = data.map(p => ({
          source: "published",
          date: String(p.date).slice(0, 10),
          publishedAt: p.published_at ? p.published_at.slice(0, 16).replace("T", " ") : String(p.date).slice(0, 10),
          title: p.title,
          url: p.url
        }));
      } catch {
        publishedPosts = [];
      }
    }

    async function loadRssPosts() {
      try {
        const res = await fetch(`/api/rss?agency=${encodeURIComponent(currentAgency)}`, { cache: "no-store" });
        if (!res.ok) return false;
        const items = await res.json();
        if (!Array.isArray(items) || !items.length) return false;
        const fresh = items.map((item) => ({
          source: "published",
          date: item.date,
          publishedAt: `${item.date} ${item.time}`,
          title: item.title,
          url: item.url
        }));
        const urlSet = new Set(fresh.map((p) => p.url));
        const merged = [...fresh, ...publishedPosts.filter((p) => !urlSet.has(p.url))];
        merged.sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
        publishedPosts.splice(0, publishedPosts.length, ...merged);
        return true;
      } catch {
        return false;
      }
    }

      return token ? token.trim() : "";

        agencyConfigCache.set(slug, data);
        return data;
      } catch {

        if (newAgency === fromAgency) {

          selectedItem.assigned_agency = newAgency;
          return;
        }
        const token = getAdminToken();
        if (!token) return;
        tab.disabled = true;
        try {
          const res = await fetch("/api/manuscripts", {
            method: "PATCH",
            headers: { "content-type": "application/json", "authorization": `Bearer ${token}` },
            body: JSON.stringify({ file_path: selectedItem.file_path, from_agency: fromAgency, to_agency: newAgency })
          });

            selectedItem.assigned_agency = newAgency;

      head.className = "config-card-head";
      head.innerHTML = `<h3>${escapeHtml(AGENCY_NAMES[slug] || slug)}</h3><span class="config-card-slug">${escapeHtml(slug)}</span>`;
      card.appendChild(head);

      if (error || !data) {
        const errBox = document.createElement("div");
        errBox.className = "config-card-empty";
        errBox.style.gridColumn = "1 / -1";
        errBox.textContent = "설정을 불러올 수 없습니다. (vercel dev 또는 프로덕션에서 동작합니다)";
        card.appendChild(errBox);
        return card;
      }

      const previewWrap = document.createElement("div");
      if (data.businessCardHtmlUrl) {
        const img = document.createElement("img");
        img.className = "config-preview preview-img";
        img.src = data.businessCardHtmlUrl;
        img.alt = `${AGENCY_NAMES[slug] || slug} 명함`;
        previewWrap.appendChild(img);
      } else {
        const empty = document.createElement("div");
        empty.className = "config-card-empty preview-empty";
        empty.textContent = "등록된 명함 이미지가 없습니다.";
        previewWrap.appendChild(empty);
      }
      card.appendChild(previewWrap);

      const fields = document.createElement("div");
      fields.className = "config-card-fields";
      fields.innerHTML = `
        <div class="config-field">
          <label>새 명함 이미지 (PNG/JPG, 3MB 이하)</label>
          <input class="biz-card-file" type="file" accept="image/png,image/jpeg">
        </div>
        <div class="config-field">
          <label>카카오 오픈채팅 URL</label>
          <input class="kakao-url" type="url" placeholder="https://open.kakao.com/..." value="${escapeHtml(data.kakaoUrl || "")}">
        </div>
        <div class="config-field">
          <label>RSS URL</label>
          <input class="rss-url" type="url" placeholder="https://rss.blog.naver.com/${escapeHtml(slug)}.xml" value="${escapeHtml(data.rssUrl || "")}">
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:2px">
          <button class="action primary save-btn" type="button" style="flex:1">저장</button>
          <span class="config-card-status"></span>
        </div>
      `;
      card.appendChild(fields);

      return card;
    }

    function attachConfigCardHandlers(card) {
      const slug = card.dataset.slug;
      const fileInput = card.querySelector(".biz-card-file");
      const kakaoInput = card.querySelector(".kakao-url");
      const rssInput = card.querySelector(".rss-url");
      const saveBtn = card.querySelector(".save-btn");
      const status = card.querySelector(".config-card-status");
      if (!saveBtn) return;

      const previewWrap = card.children[1];

      function setPreview(src) {
        if (!previewWrap) return;
        previewWrap.innerHTML = "";
        if (src) {
          const img = document.createElement("img");
          img.className = "config-preview preview-img";
          img.src = src;
          img.alt = `${AGENCY_NAMES[slug] || slug} 명함`;
          previewWrap.appendChild(img);
        } else {
          const empty = document.createElement("div");
          empty.className = "config-card-empty preview-empty";
          empty.textContent = "등록된 명함 이미지가 없습니다.";
          previewWrap.appendChild(empty);
        }
      }

      fileInput?.addEventListener("change", () => {
        const f = fileInput.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (e) => setPreview(e.target.result);
        reader.readAsDataURL(f);
      });

      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        status.textContent = "저장 중...";
        status.className = "config-card-status";
        try {
          const file = fileInput?.files?.[0];
          let res;
          if (file) {
            const fd = new FormData();
            fd.append("kakaoUrl", kakaoInput.value.trim());
            fd.append("rssUrl", rssInput.value.trim());
            fd.append("businessCardImage", file);
            res = await fetch(`/api/agency-config?agency=${encodeURIComponent(slug)}`, { method: "POST", body: fd });
          } else {
            res = await fetch(`/api/agency-config?agency=${encodeURIComponent(slug)}`, {
              method: "PUT",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                kakaoUrl: kakaoInput.value.trim(),
                rssUrl: rssInput.value.trim()
              })
            });
          }
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            status.textContent = `오류: ${err.error || res.status}`;
            status.classList.add("err");
            return;
          }
          const saved = await res.json();
          agencyConfigCache.set(slug, saved);
          setPreview(saved.businessCardHtmlUrl || "");
          if (fileInput) fileInput.value = "";
          status.textContent = "저장 완료";
          status.classList.add("ok");
          setTimeout(() => { status.textContent = ""; status.className = "config-card-status"; }, 2000);
        } catch {
          status.textContent = "저장 실패";
          status.classList.add("err");
        } finally {
          saveBtn.disabled = false;
        }
      });
    }

    async function openConfigModal() {
      configList.innerHTML = `<p class="modal-empty">불러오는 중...</p>`;
      configModal.hidden = false;
      const results = await Promise.all(CONFIG_AGENCIES.map(async slug => {
        try {
          agencyConfigCache.delete(slug);
          const res = await fetch(`/api/agency-config?agency=${encodeURIComponent(slug)}`, { cache: "no-store" });
          if (!res.ok) return { slug, error: true };
          const data = await res.json();
          agencyConfigCache.set(slug, data);
          return { slug, data };
        } catch {
          return { slug, error: true };
        }
      }));
      configList.innerHTML = "";
      results.forEach(({ slug, data, error }) => {
        const card = buildConfigCard(slug, data, error);
        configList.appendChild(card);
        attachConfigCardHandlers(card);
      });
    }

    showConfig.addEventListener("click", openConfigModal);
    closeConfigModal.addEventListener("click", () => { configModal.hidden = true; });
    configModal.addEventListener("click", (e) => { if (e.target === configModal) configModal.hidden = true; });

    copyWriteUrl.addEventListener("click", async () => {
      if (selectedDraftAgency === "mih_history") return;
      const url = `https://blog.naver.com/${selectedDraftAgency}/postwrite`;
      try {
        await navigator.clipboard.writeText(url);
        copyWriteUrl.textContent = "복사됨";
        setTimeout(() => { copyWriteUrl.textContent = "URL 복사"; }, 1200);
      } catch {
        window.prompt("URL을 복사하세요:", url);
      }
    });

    agencyTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        if (tab.dataset.agency === currentAgency) return;
        currentAgency = tab.dataset.agency;
        agencyTabs.forEach(t => t.classList.toggle("active", t === tab));
        agencyLabel.textContent = AGENCY_NAMES[currentAgency] || currentAgency;
        manuscripts = [];
        publishedPosts = [];
        selectedPathValue = "";
        selectedItem = null;
        draftBar.hidden = true;
        selectedTitle.textContent = "원고를 선택하세요";
        selectedPath.textContent = "목록에서 파일을 선택하면 이 영역에 원본 HTML이 표시됩니다.";
        preview.removeAttribute("src");
        preview.removeAttribute("srcdoc");
        render();
        loadManuscripts(currentAgency);
        loadPosts(currentAgency);
      });
    });

    setTodayFilter();
    render();
    loadManuscripts(currentAgency);
    loadPosts(currentAgency);
  </script>
</body>
</html>
