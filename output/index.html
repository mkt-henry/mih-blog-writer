<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모아보기 · MIH</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    color: #222;
    background: #f5f6f8;
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 100vh;
  }
  aside {
    background: #fff;
    border-right: 1px solid #e3e5ea;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-top { display: flex; align-items: center; padding: 16px 20px 8px; gap: 8px; }
  aside h1 { font-size: 16px; margin: 0; flex: 1; }
  .sidebar-top a.kw-link {
    font-size: 11px;
    color: #888;
    text-decoration: none;
    padding: 3px 8px;
    border: 1px solid #d8dbe1;
    border-radius: 5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sidebar-top a.kw-link:hover { background: #f4f6f9; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 16px 12px;
    border-bottom: 1px solid #eef0f3;
  }
  .tabs button {
    flex: 1 1 auto;
    min-width: 0;
    padding: 6px 10px;
    border: 1px solid #d8dbe1;
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: #444;
  }
  .tabs button.active {
    background: #1565C0;
    color: #fff;
    border-color: #1565C0;
  }
  .tabs .tab-ct { color: #999; font-weight: 500; }
  .tabs button.active .tab-ct { color: #fff; opacity: 0.85; }

  /* ---- 달력 필터 ---- */
  .date-filter {
    padding: 10px 16px 12px;
    border-bottom: 1px solid #eef0f3;
  }
  .date-filter-header {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .date-filter-header span {
    font-size: 11px;
    color: #777;
    flex: 1;
  }
  .date-filter-header button {
    font-size: 11px;
    color: #1565C0;
    background: none;
    border: 1px solid #c5d5ef;
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
    line-height: 1.6;
  }
  .date-filter-header button:hover { background: #e8f0fe; }
  .cal-nav {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
  }
  .cal-nav .cal-arrow {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: #555;
    padding: 2px 8px;
    border-radius: 4px;
    line-height: 1.4;
  }
  .cal-nav .cal-arrow:hover { background: #f0f2f5; }
  .cal-nav .cal-month-label {
    flex: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #333;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 1px;
    column-gap: 0;
    margin-bottom: 6px;
  }
  .cal-dow {
    font-size: 10px;
    color: #aaa;
    text-align: center;
    padding: 3px 0 5px;
  }
  .cal-day {
    font-size: 12px;
    text-align: center;
    padding: 5px 0;
    cursor: pointer;
    border-radius: 4px;
    user-select: none;
    color: #333;
    line-height: 1.4;
    position: relative;
  }
  .cal-day.cal-empty { cursor: default; }
  .cal-day.cal-no-data { color: #d0d0d0; cursor: default; }
  .cal-day:hover:not(.cal-empty):not(.cal-no-data):not(.range-start):not(.range-end) {
    background: #f0f4fd;
  }
  .cal-day.range-start,
  .cal-day.range-end {
    background: #1565C0;
    color: #fff !important;
    font-weight: 600;
    border-radius: 4px;
    z-index: 1;
  }
  .cal-day.in-range {
    background: #dce8fa;
    border-radius: 0;
    color: #1a3a6b;
  }
  /* 시작·끝이 같은 날(단일 선택)일 때 */
  .cal-day.range-start.range-end { border-radius: 4px; }
  /* 범위 연결: start 오른쪽, end 왼쪽 평탄화 */
  .cal-day.range-start:not(.range-end) { border-radius: 4px 0 0 4px; }
  .cal-day.range-end:not(.range-start) { border-radius: 0 4px 4px 0; }
  .cal-day.today:not(.range-start):not(.range-end) {
    font-weight: 700;
    color: #1565C0;
  }
  .cal-range-label {
    font-size: 10px;
    color: #888;
    text-align: center;
    min-height: 14px;
  }

  .meta {
    padding: 8px 20px;
    font-size: 11px;
    color: #888;
    border-bottom: 1px solid #eef0f3;
  }
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .item {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 10px 20px;
    font: inherit;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .item:hover { background: #f4f6f9; }
  .item.active { background: #e8f0fe; border-left-color: #1565C0; }
  .item .slug { font-size: 13px; font-weight: 600; color: #222; }
  .item .title { font-size: 11px; color: #666; margin-top: 2px; line-height: 1.4; }
  .item .date { font-size: 10px; color: #999; margin-top: 2px; }

  main {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #f5f6f8;
  }
  header.topbar {
    padding: 12px 20px;
    border-bottom: 1px solid #e3e5ea;
    background: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header.topbar .title-block { flex: 1; min-width: 0; }
  header.topbar h2 {
    font-size: 14px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header.topbar .path {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header.topbar button {
    padding: 8px 14px;
    border: 1px solid #1565C0;
    background: #1565C0;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  header.topbar button.secondary {
    background: #fff;
    color: #1565C0;
  }
  header.topbar button:disabled {
    background: #d6d8de;
    border-color: #d6d8de;
    color: #fff;
    cursor: not-allowed;
  }
  iframe#preview {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }
  .empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: #999;
    font-size: 14px;
    padding: 40px;
    text-align: center;
  }
</style>
</head>
<body>
<aside>
  <div class="sidebar-top">
    <h1>모아보기</h1>
    <a class="kw-link" href="keywords.html">키워드 관리</a>
    <a class="kw-link" href="rss.html">발행 현황</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="date-filter">
    <div class="date-filter-header">
      <span>기간 필터</span>
      <button id="cal-clear">전체</button>
    </div>
    <div class="cal-nav">
      <button class="cal-arrow" id="cal-prev">&#8249;</button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="cal-arrow" id="cal-next">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-range-label" id="cal-range-label">전체 일자</div>
  </div>
  <div class="meta" id="meta"></div>
  <div class="list" id="list"></div>
</aside>
<main>
  <header class="topbar">
    <div class="title-block">
      <h2 id="selected-title">왼쪽에서 원고를 선택하세요</h2>
      <div class="path" id="selected-path">발행 계정 탭을 누르고 원고를 클릭하면 미리보기가 나옵니다.</div>
    </div>
    <button id="copy-title" disabled>제목 복사</button>
  </header>
  <iframe id="preview" sandbox="allow-same-origin"></iframe>
</main>

<script src="manifest.js?v=1779248851551"></script>
<script>
(() => {
  const data = window.MIH;
  if (!data) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#b00">manifest.js를 찾지 못했습니다. <code>npm run build</code>로 생성하세요.</div>';
    return;
  }

  const tabsEl = document.getElementById("tabs");
  const metaEl = document.getElementById("meta");
  const listEl = document.getElementById("list");
  const previewEl = document.getElementById("preview");
  const titleEl = document.getElementById("selected-title");
  const pathEl = document.getElementById("selected-path");
  const copyTitleBtn = document.getElementById("copy-title");
  const calGridEl = document.getElementById("cal-grid");
  const calMonthLabelEl = document.getElementById("cal-month-label");
  const calRangeLabelEl = document.getElementById("cal-range-label");
  const calPrevBtn = document.getElementById("cal-prev");
  const calNextBtn = document.getElementById("cal-next");
  const calClearBtn = document.getElementById("cal-clear");

  let currentAgency = "all";
  let rangeStart = null;  // "YYYY-MM-DD" | null
  let rangeEnd = null;    // "YYYY-MM-DD" | null
  let calYear, calMonth;
  let selected = null;

  const todayObj = new Date();
  const todayStr = fmtDate(todayObj.getFullYear(), todayObj.getMonth() + 1, todayObj.getDate());

  function fmtDate(y, m, d) {
    return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }

  // ---- 탭 ----
  const allBtn = document.createElement("button");
  allBtn.dataset.slug = "all";
  allBtn.textContent = "전체";
  const allCt = document.createElement("span");
  allCt.className = "tab-ct";
  allCt.textContent = ` (${data.manuscripts.length})`;
  allBtn.appendChild(allCt);
  allBtn.addEventListener("click", () => {
    currentAgency = "all";
    selected = null;
    rangeStart = null;
    rangeEnd = null;
    initCalendarMonth();
    renderCalendar();
    render();
  });
  tabsEl.appendChild(allBtn);

  Object.entries(data.agencies).forEach(([slug, info]) => {
    const btn = document.createElement("button");
    btn.dataset.slug = slug;
    btn.textContent = info.blogSlug;
    const ct = document.createElement('span');
    ct.className = 'tab-ct';
    ct.dataset.ct = slug;
    btn.appendChild(ct);
    btn.addEventListener("click", () => {
      currentAgency = slug;
      selected = null;
      rangeStart = null;
      rangeEnd = null;
      initCalendarMonth();
      renderCalendar();
      render();
    });
    tabsEl.appendChild(btn);
  });

  // ---- 탭 라벨에 원고/발행 건수 표시 ----
  // 우선 원고 수만 즉시 노출 (RSS는 비동기로 합쳐서 갱신)
  document.querySelectorAll('.tab-ct[data-ct]').forEach(el => {
    const slug = el.dataset.ct;
    const msCount = data.manuscripts.filter(m => m.agency === slug).length;
    el.textContent = ` (${msCount})`;
  });
  (async () => {
    try {
      const r = await fetch('/api/rss');
      if (!r.ok) return;
      const rss = await r.json();
      document.querySelectorAll('.tab-ct[data-ct]').forEach(el => {
        const slug = el.dataset.ct;
        const msCount = data.manuscripts.filter(m => m.agency === slug).length;
        const entry = rss[slug];
        const n = entry && !entry.error && Array.isArray(entry.items) ? entry.items.length : null;
        el.textContent = n == null ? ` (${msCount})` : ` (${msCount}/${n})`;
      });
    } catch {}
  })();

  // ---- 달력 ----
  function manuscriptsForCurrentAgency() {
    if (currentAgency === "all") return data.manuscripts;
    return data.manuscripts.filter((m) => m.agency === currentAgency);
  }

  function datesForCurrentAgency() {
    return new Set(manuscriptsForCurrentAgency().map((m) => m.date));
  }

  function initCalendarMonth() {
    const dates = manuscriptsForCurrentAgency().map((m) => m.date).sort();
    if (dates.length) {
      const latest = dates[dates.length - 1];
      calYear = parseInt(latest.slice(0, 4), 10);
      calMonth = parseInt(latest.slice(5, 7), 10) - 1;
    } else {
      calYear = todayObj.getFullYear();
      calMonth = todayObj.getMonth();
    }
  }

  function normRange() {
    if (!rangeStart) return { s: null, e: null };
    if (!rangeEnd) return { s: rangeStart, e: rangeStart };
    return rangeStart <= rangeEnd
      ? { s: rangeStart, e: rangeEnd }
      : { s: rangeEnd, e: rangeStart };
  }

  function renderCalendar() {
    calMonthLabelEl.textContent = `${calYear}년 ${calMonth + 1}월`;
    calGridEl.innerHTML = "";

    ["일", "월", "화", "수", "목", "금", "토"].forEach((d) => {
      const el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      calGridEl.appendChild(el);
    });

    const firstDow = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const availDates = datesForCurrentAgency();
    const { s, e } = normRange();

    for (let i = 0; i < firstDow; i++) {
      const el = document.createElement("div");
      el.className = "cal-day cal-empty";
      calGridEl.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = fmtDate(calYear, calMonth + 1, d);
      const el = document.createElement("div");
      el.className = "cal-day";
      el.textContent = d;

      const hasData = availDates.has(dateStr);
      if (!hasData) el.classList.add("cal-no-data");
      if (dateStr === todayStr) el.classList.add("today");

      if (s) {
        if (dateStr === s) el.classList.add("range-start");
        if (dateStr === e) el.classList.add("range-end");
        if (dateStr > s && dateStr < e) el.classList.add("in-range");
      }

      if (hasData) {
        el.addEventListener("click", () => {
          if (!rangeStart || rangeEnd) {
            rangeStart = dateStr;
            rangeEnd = null;
          } else if (dateStr === rangeStart) {
            rangeStart = null;
          } else {
            rangeEnd = dateStr;
          }
          selected = null;
          renderCalendar();
          render();
        });
      }

      calGridEl.appendChild(el);
    }

    updateRangeLabel();
  }

  function updateRangeLabel() {
    if (!rangeStart) {
      calRangeLabelEl.textContent = "전체 일자";
    } else if (!rangeEnd) {
      calRangeLabelEl.textContent = rangeStart;
    } else {
      const { s, e } = normRange();
      calRangeLabelEl.textContent = `${s} ~ ${e}`;
    }
  }

  calPrevBtn.addEventListener("click", () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });

  calNextBtn.addEventListener("click", () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });

  calClearBtn.addEventListener("click", () => {
    rangeStart = null;
    rangeEnd = null;
    selected = null;
    initCalendarMonth();
    renderCalendar();
    render();
  });

  function dateMatches(date) {
    if (!rangeStart) return true;
    const { s, e } = normRange();
    return date >= s && date <= e;
  }

  // ---- 명함 + 카카오 합성 ----
  function buildBusinessCardHtml(agencySlug) {
    const a = data.agencies[agencySlug];
    if (!a || !a.businessCardImageUrl) return "";
    const linkUrl = data.businessCardLinkUrl || "";
    const img = `<img src="${a.businessCardImageUrl}" width="${a.businessCardWidth || 544}">`;
    const inner = linkUrl ? `<a href="${linkUrl}">${img}</a>` : img;
    return `<p align="center">${inner}</p>`;
  }

  function mergeWithBusinessCard(originalHtml, cardHtml) {
    if (!cardHtml) return originalHtml || "";
    if (!originalHtml) return cardHtml;
    const m = originalHtml.match(/<a\s[^>]*href=["']https:\/\/open\.kakao\.com\//i);
    if (m && typeof m.index === "number") {
      const pStart = originalHtml.lastIndexOf("<p ", m.index);
      if (pStart !== -1) {
        return originalHtml.slice(0, pStart) + cardHtml + "\n" + originalHtml.slice(pStart);
      }
    }
    return `${originalHtml}\n${cardHtml}`;
  }

  // ---- 미리보기 ----
  function renderPreview() {
    if (!selected) {
      previewEl.srcdoc = '<!doctype html><body style="font-family:sans-serif;padding:40px;color:#999;display:grid;place-items:center;height:100%;margin:0">왼쪽에서 원고를 선택하세요</body>';
      return;
    }
    const cardHtml = buildBusinessCardHtml(selected.agency);
    const merged = mergeWithBusinessCard(selected.html, cardHtml);
    previewEl.srcdoc = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body { margin:0; padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; color:#222; background:#fff; line-height:1.6; }
img { max-width:100%; height:auto; }
hr { border:none; border-top:1px solid #e0e0e0; margin:20px 0; }
</style></head><body>${merged}</body></html>`;
  }

  // ---- 목록 ----
  function render() {
    Array.from(tabsEl.children).forEach((b) => b.classList.toggle("active", b.dataset.slug === currentAgency));

    const items = data.manuscripts.filter(
      (m) => (currentAgency === "all" || m.agency === currentAgency) && dateMatches(m.date)
    );

    let dateLabel = "전체 일자";
    if (rangeStart && !rangeEnd) {
      dateLabel = rangeStart;
    } else if (rangeStart && rangeEnd) {
      const { s, e } = normRange();
      dateLabel = `${s} ~ ${e}`;
    }

    metaEl.textContent = `${items.length}개 원고 · ${dateLabel} · 빌드 ${data.generatedAt.slice(0, 10)}`;

    listEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = !rangeStart
        ? "등록된 원고가 없습니다."
        : "선택한 기간에 해당하는 원고가 없습니다.";
      listEl.appendChild(empty);
    }
    for (const item of items) {
      const btn = document.createElement("button");
      btn.className = "item" + (selected && selected.path === item.path ? " active" : "");
      btn.innerHTML = `
        <div class="slug">${escapeHtml(item.slug)}</div>
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="date">${escapeHtml(item.date)}</div>
      `;
      btn.addEventListener("click", () => {
        selected = item;
        updateHeader();
        renderPreview();
        render();
      });
      listEl.appendChild(btn);
    }

    updateHeader();
    renderPreview();
  }

  function updateHeader() {
    if (!selected) {
      titleEl.textContent = "왼쪽에서 원고를 선택하세요";
      pathEl.textContent = "발행 계정 탭을 누르고 원고를 클릭하면 미리보기가 나옵니다.";
      copyTitleBtn.disabled = true;
      return;
    }
    titleEl.textContent = selected.title;
    pathEl.textContent = `${selected.agency} · ${selected.path}`;
    copyTitleBtn.disabled = false;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- 복사 ----
  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }
  }

  copyTitleBtn.addEventListener("click", async () => {
    if (!selected) return;
    copyTitleBtn.disabled = true;
    const original = copyTitleBtn.textContent;
    copyTitleBtn.textContent = "준비 중...";
    const ok = await copyToClipboard(selected.title);
    copyTitleBtn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => {
      copyTitleBtn.textContent = original;
      copyTitleBtn.disabled = false;
    }, 1500);
  });

  initCalendarMonth();
  renderCalendar();
  render();

  // keywords.html 등에서 ?path=... 로 직접 링크된 경우 해당 원고 자동 선택
  const deepPath = new URLSearchParams(location.search).get("path");
  if (deepPath) {
    const target = data.manuscripts.find((m) => m.path === deepPath);
    if (target) {
      currentAgency = target.agency;
      selected = target;
      initCalendarMonth();
      renderCalendar();
      render();
    }
  }
})();
</script>
</body>
</html>
