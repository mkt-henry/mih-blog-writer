<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모아보기 · MIH</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    color: #222;
    background: #f5f6f8;
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 100vh;
  }
  aside {
    background: #fff;
    border-right: 1px solid #e3e5ea;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  aside h1 { font-size: 16px; margin: 0; padding: 16px 20px 8px; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 16px 12px;
    border-bottom: 1px solid #eef0f3;
  }
  .tabs button {
    flex: 1 1 auto;
    min-width: 0;
    padding: 6px 10px;
    border: 1px solid #d8dbe1;
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: #444;
  }
  .tabs button.active {
    background: #1565C0;
    color: #fff;
    border-color: #1565C0;
  }
  .meta {
    padding: 8px 20px;
    font-size: 11px;
    color: #888;
    border-bottom: 1px solid #eef0f3;
  }
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .item {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 10px 20px;
    font: inherit;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .item:hover { background: #f4f6f9; }
  .item.active { background: #e8f0fe; border-left-color: #1565C0; }
  .item .slug { font-size: 13px; font-weight: 600; color: #222; }
  .item .title { font-size: 11px; color: #666; margin-top: 2px; line-height: 1.4; }
  .item .date { font-size: 10px; color: #999; margin-top: 2px; }

  main {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #f5f6f8;
  }
  header.topbar {
    padding: 12px 20px;
    border-bottom: 1px solid #e3e5ea;
    background: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header.topbar .title-block { flex: 1; min-width: 0; }
  header.topbar h2 {
    font-size: 14px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header.topbar .path {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header.topbar button {
    padding: 8px 14px;
    border: 1px solid #1565C0;
    background: #1565C0;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  header.topbar button.secondary {
    background: #fff;
    color: #1565C0;
  }
  header.topbar button:disabled {
    background: #d6d8de;
    border-color: #d6d8de;
    color: #fff;
    cursor: not-allowed;
  }
  iframe#preview {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }
  .empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: #999;
    font-size: 14px;
    padding: 40px;
    text-align: center;
  }
</style>
</head>
<body>
<aside>
  <h1>모아보기</h1>
  <div class="tabs" id="tabs"></div>
  <div class="meta" id="meta"></div>
  <div class="list" id="list"></div>
</aside>
<main>
  <header class="topbar">
    <div class="title-block">
      <h2 id="selected-title">왼쪽에서 원고를 선택하세요</h2>
      <div class="path" id="selected-path">발행 계정 탭을 누르고 원고를 클릭하면 미리보기가 나옵니다.</div>
    </div>
    <button id="copy-write-url" class="secondary" disabled>글쓰기 URL 복사</button>
    <button id="copy-content" disabled>콘텐츠 복사</button>
  </header>
  <iframe id="preview" sandbox="allow-same-origin"></iframe>
</main>

<script src="manifest.js"></script>
<script>
(() => {
  const data = window.MIH;
  if (!data) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#b00">manifest.js를 찾지 못했습니다. <code>npm run build</code>로 생성하세요.</div>';
    return;
  }

  const tabsEl = document.getElementById("tabs");
  const metaEl = document.getElementById("meta");
  const listEl = document.getElementById("list");
  const previewEl = document.getElementById("preview");
  const titleEl = document.getElementById("selected-title");
  const pathEl = document.getElementById("selected-path");
  const copyContentBtn = document.getElementById("copy-content");
  const copyWriteUrlBtn = document.getElementById("copy-write-url");

  let currentAgency = "mih_speaker";
  let selected = null;

  // ---- 탭 ----
  Object.entries(data.agencies).forEach(([slug, info]) => {
    const btn = document.createElement("button");
    btn.dataset.slug = slug;
    btn.textContent = info.short;
    btn.addEventListener("click", () => {
      currentAgency = slug;
      selected = null;
      render();
    });
    tabsEl.appendChild(btn);
  });

  // ---- 명함 + 카카오 합성 ----
  // 카카오 오픈채팅 링크가 들어 있는 <p> 바로 앞에 명함 HTML을 끼워넣는다.
  // 카카오 링크가 없으면 끝에 붙인다.
  function buildBusinessCardHtml(agencySlug) {
    const a = data.agencies[agencySlug];
    if (!a || !a.businessCardImageUrl) return "";
    const linkUrl = data.businessCardLinkUrl || "";
    const img = `<img src="${a.businessCardImageUrl}" width="${a.businessCardWidth || 544}">`;
    const inner = linkUrl ? `<a href="${linkUrl}">${img}</a>` : img;
    return `<p align="center">${inner}</p>`;
  }

  function mergeWithBusinessCard(originalHtml, cardHtml) {
    if (!cardHtml) return originalHtml || "";
    if (!originalHtml) return cardHtml;
    const m = originalHtml.match(/<a\s[^>]*href=["']https:\/\/open\.kakao\.com\//i);
    if (m && typeof m.index === "number") {
      const pStart = originalHtml.lastIndexOf("<p ", m.index);
      if (pStart !== -1) {
        return originalHtml.slice(0, pStart) + cardHtml + "\n" + originalHtml.slice(pStart);
      }
    }
    return `${originalHtml}\n${cardHtml}`;
  }

  // ---- 미리보기 ----
  function renderPreview() {
    if (!selected) {
      previewEl.removeAttribute("srcdoc");
      previewEl.srcdoc = '<!doctype html><body style="font-family:sans-serif;padding:40px;color:#999;display:grid;place-items:center;height:100%;margin:0">왼쪽에서 원고를 선택하세요</body>';
      return;
    }
    const cardHtml = buildBusinessCardHtml(selected.agency);
    const merged = mergeWithBusinessCard(selected.html, cardHtml);
    previewEl.srcdoc = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body { margin:0; padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; color:#222; background:#fff; line-height:1.6; }
img { max-width:100%; height:auto; }
hr { border:none; border-top:1px solid #e0e0e0; margin:20px 0; }
</style></head><body>${merged}</body></html>`;
  }

  // ---- 목록 ----
  function render() {
    Array.from(tabsEl.children).forEach((b) => b.classList.toggle("active", b.dataset.slug === currentAgency));

    const items = data.manuscripts.filter((m) => m.agency === currentAgency);
    metaEl.textContent = `${items.length}개 원고 · 빌드 ${data.generatedAt.slice(0, 10)}`;

    listEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "이 계정에 등록된 원고가 없습니다.";
      listEl.appendChild(empty);
    }
    for (const item of items) {
      const btn = document.createElement("button");
      btn.className = "item" + (selected && selected.path === item.path ? " active" : "");
      btn.innerHTML = `
        <div class="slug">${escapeHtml(item.slug)}</div>
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="date">${escapeHtml(item.date)}</div>
      `;
      btn.addEventListener("click", () => {
        selected = item;
        updateHeader();
        renderPreview();
        render();
      });
      listEl.appendChild(btn);
    }

    updateHeader();
    renderPreview();
  }

  function updateHeader() {
    if (!selected) {
      titleEl.textContent = "왼쪽에서 원고를 선택하세요";
      pathEl.textContent = "발행 계정 탭을 누르고 원고를 클릭하면 미리보기가 나옵니다.";
      copyContentBtn.disabled = true;
      copyWriteUrlBtn.disabled = true;
      return;
    }
    titleEl.textContent = selected.title;
    pathEl.textContent = `${selected.agency} · ${selected.path}`;
    copyContentBtn.disabled = false;
    copyWriteUrlBtn.disabled = currentAgency === "mih_history";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- 복사 ----
  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // file:// 환경에서 권한 거부될 수 있음 — fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }
  }

  copyContentBtn.addEventListener("click", async () => {
    if (!selected) return;
    const cardHtml = buildBusinessCardHtml(selected.agency);
    const merged = mergeWithBusinessCard(selected.html, cardHtml);
    copyContentBtn.disabled = true;
    const original = copyContentBtn.textContent;
    copyContentBtn.textContent = "준비 중...";
    const ok = await copyToClipboard(merged.trim());
    copyContentBtn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => {
      copyContentBtn.textContent = original;
      copyContentBtn.disabled = false;
    }, 1500);
  });

  copyWriteUrlBtn.addEventListener("click", async () => {
    if (!selected) return;
    const blogSlug = data.agencies[selected.agency]?.blogSlug || selected.agency;
    const url = `https://blog.naver.com/${blogSlug}/postwrite`;
    copyWriteUrlBtn.disabled = true;
    const original = copyWriteUrlBtn.textContent;
    copyWriteUrlBtn.textContent = "준비 중...";
    const ok = await copyToClipboard(url);
    copyWriteUrlBtn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => {
      copyWriteUrlBtn.textContent = original;
      copyWriteUrlBtn.disabled = false;
    }, 1500);
  });

  render();
})();
</script>
</body>
</html>
