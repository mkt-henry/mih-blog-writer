    :root {
      --bg: #f7f8fa;

      --text: #222222;
      --muted: #6b7280;
      --line: #d9dee7;
      --brand: #2454a6;
      --brand-soft: #e7eefc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .button,
    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: #1f2937;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .toolbar {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .dates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .date-tab {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .date-tab.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 220px;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 16px;
      resize: vertical;
      color: #111827;
      background: #fbfcff;
      font: 14px/1.65 Consolas, "SFMono-Regular", Menlo, monospace;
      outline: none;
    }

    .rows {
      display: grid;
    }

    .row {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .time {
      color: var(--brand);
      font-weight: 800;
      font-size: 13px;
    }

    .title {
      display: block;
      margin-bottom: 5px;
      color: #111827;
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .url {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 720px) {
      .top,
      .summary {
        flex-direction: column;
        align-items: stretch;
      }

      .nav {
        width: 100%;
      }

      .nav a,
      .button {
        flex: 1;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>

    const tabs = document.getElementById("dateTabs");
    const selectedDate = document.getElementById("selectedDate");
    const countText = document.getElementById("countText");
    const urlList = document.getElementById("urlList");
    const rows = document.getElementById("rows");
    const copyButton = document.getElementById("copyButton");
    let activeDate = posts[0].date;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderTabs() {
      const dates = [...new Set(posts.map((post) => post.date))];
      tabs.innerHTML = "";
      dates.forEach((date) => {
        const count = posts.filter((post) => post.date === date).length;
        const button = document.createElement("button");
        button.className = `date-tab${date === activeDate ? " active" : ""}`;
        button.type = "button";
        button.textContent = `${date} (${count})`;
        button.addEventListener("click", () => {
          activeDate = date;
          render();
        });
        tabs.appendChild(button);
      });
    }

    function render() {
      renderTabs();
      const items = posts.filter((post) => post.date === activeDate);
      const urls = items.map((post) => post.url).join("\n");
      selectedDate.textContent = activeDate;
      countText.textContent = `발행 URL ${items.length}개`;
      urlList.value = urls;
      rows.innerHTML = items.map((post) => `
        <div class="row">
          <div class="time">${escapeHtml(post.time)}</div>
          <div>
            <span class="title">${escapeHtml(post.title)}</span>
            <a class="url" href="${escapeHtml(post.url)}" target="_blank" rel="noopener">${escapeHtml(post.url)}</a>
          </div>
        </div>
      `).join("");
    }

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(urlList.value);
        copyButton.textContent = "복사됨";
        setTimeout(() => {
          copyButton.textContent = "URL 전체 복사";
        }, 1200);
      } catch {
        urlList.select();
        document.execCommand("copy");
      }
    });

    render();
  </script>
