name: MIH 발행 현황 Discord 알림

# Supabase 플랜 차단(402)과 무관하게 돌도록 GitHub Actions 에서 엣지 함수 코드를 직접 실행한다.
# 네이버 RSS 만 읽고 Discord 웹훅으로 보내므로 Supabase 접근이 필요 없다.

on:
  schedule:
    - cron: '30 0 * * *'   # 매일 09:30 KST (00:30 UTC)
  workflow_dispatch:        # 수동 실행

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Discord 알림 전송
        env:
          RUN_ONCE: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: deno run --allow-net --allow-env supabase/functions/discord-notify/index.ts
