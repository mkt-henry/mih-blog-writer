name: MIH 발행 현황 Discord 알림

# 예비 발송 경로다. 정규 스케줄은 Supabase pg_cron 잡 mih-daily-discord 이며
# (20260907020000_discord_notify_back_to_pg_cron.sql), 여기서는 자동 실행하지 않는다.
# 이중 발송을 막기 위해 schedule 트리거를 두지 않는다.
#
# 2026-09-07 오전 Supabase egress 402 로 엣지 함수가 막혔을 때 이 워크플로로 이전했다가,
# 같은 날 차단이 풀린 것을 확인해 pg_cron 으로 되돌렸다. 다시 막히면 아래 수동 실행으로
# 발송한다 — 네이버 RSS 와 Discord 웹훅만 쓰므로 Supabase 없이도 돈다.

on:
  workflow_dispatch:        # 수동 실행 전용 (Supabase 가 막혔을 때 쓴다)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Discord 알림 전송
        env:
          RUN_ONCE: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: deno run --allow-net --allow-env supabase/functions/discord-notify/index.ts
