name: Sync manuscripts to Supabase

on:
  push:
    branches: [main]
    paths:
      - "output/**/*.html"
      - "scripts/sync-manuscripts.js"
      - ".github/workflows/sync-manuscripts.yml"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "전체 스캔으로 동기화 (체크 안 하면 마지막 push 이후 변경분만)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with prior commit for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Determine sync mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Mode: full sync (manual)"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Mode: full sync (no prior ref)"
          else
            echo "args=--since=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "Mode: incremental from ${{ github.event.before }}"
          fi

      - name: Sync manuscripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-manuscripts.js ${{ steps.mode.outputs.args }}
