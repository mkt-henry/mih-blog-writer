name: Supabase 플랜 갱신 알림

# 2026-09-07 egress 한도 초과로 Pro 로 올렸다. 갱신일(매달 7일) 전에 무료로 내릴지 판단하도록
# 10월 5일·6일 09:30 KST 에 한 번씩 알린다. 판단이 끝나면 이 파일은 지운다.
# 2026-10-05: Discord 대신 AIStudio 알림(repo secret AISTUDIO_NOTIFY_TOKEN, 토큰 label mih-github).
# 2026-10-06: Owner 요청으로 Discord 발행현황 채널에도 예전 문구 그대로 같이 보낸다(repo secret DISCORD_WEBHOOK_URL,
#             비우면 Discord 만 꺼진다). 두 단계는 따로 돈다 — 한쪽이 실패해도 다른 쪽은 나간다.
#             같은 날 AIStudio 가 이미 받은 알림(deduped)이면 Discord 도 다시 보내지 않는다.

on:
  schedule:
    - cron: '30 0 5,6 10 *'   # 10/5, 10/6 09:30 KST (00:30 UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "연결 확인만 ([테스트] 제목, 푸시 없음, Discord 로는 안 보냄)"
        type: boolean
        default: false
      only:
        description: "한쪽에만 보내기 (비우면 둘 다)"
        type: choice
        options: ["", "aistudio", "discord"]
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: AIStudio 알림
        id: aistudio
        if: inputs.only != 'discord'
        env:
          AISTUDIO_NOTIFY_TOKEN: ${{ secrets.AISTUDIO_NOTIFY_TOKEN }}
          TEST: ${{ inputs.test && '1' || '' }}
        run: |
          set -o pipefail
          body=$(cat <<'EOF2'
          9월 7일 사진 재압축으로 전송량이 58% 줄었습니다. 한 달 전송량(Egress)이 5GB 미만이면 무료 플랜으로 충분합니다.

          1. 사용량 확인: https://supabase.com/dashboard/org/wabptptdtkmixdxtuwsz/usage
          2. 5GB 미만이면 플랜 변경: https://supabase.com/dashboard/org/wabptptdtkmixdxtuwsz/billing

          애매하면 Claude 에게 "Supabase 플랜 봐줘" 라고 물어보세요.
          EOF2
          )
          title="⏰ Supabase Pro 갱신 예정 (10월 7일) — 무료로 내릴지 지금 결정하세요"
          if [ -n "$TEST" ]; then
            jq -n --arg t "[테스트] $title" --arg b "$body" --arg k "plan-reminder-test-${GITHUB_RUN_ID}" \
              '{title:$t, body:$b, level:"info", push:false, dedupe_key:$k}' > payload.json
          else
            jq -n --arg t "$title" --arg b "$body" --arg k "plan-reminder-$(TZ=Asia/Seoul date +%F)" \
              '{title:$t, body:$b, level:"warning", url:"https://supabase.com/dashboard/org/wabptptdtkmixdxtuwsz/usage", dedupe_key:$k, dedupe_minutes:1440}' > payload.json
          fi
          curl -fsS https://aistudio.bp-studio.com/api/hooks/notify \
            -H "Authorization: Bearer $AISTUDIO_NOTIFY_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @payload.json | tee response.json
          echo "deduped=$(jq -r '.deduped // false' response.json)" >> "$GITHUB_OUTPUT"

      - name: Discord 알림 (발행현황 채널)
        if: always() && !inputs.test && inputs.only != 'aistudio' && steps.aistudio.outputs.deduped != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL 없음 — Discord 꺼짐"; exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' "$DISCORD_WEBHOOK_URL" -d @- <<'EOF'
          {"content": "⏰ **Supabase Pro 갱신 예정 (10월 7일)** — 무료로 내릴지 지금 결정하세요.\n\n9월 7일 사진 재압축으로 전송량이 58% 줄었습니다. 한 달 전송량(Egress)이 5GB 미만이면 무료 플랜으로 충분합니다.\n1) 사용량 확인: https://supabase.com/dashboard/org/wabptptdtkmixdxtuwsz/usage\n2) 5GB 미만이면 플랜 변경: https://supabase.com/dashboard/org/wabptptdtkmixdxtuwsz/billing\n\n애매하면 Claude 에게 \"Supabase 플랜 봐줘\" 라고 물어보세요."}
          EOF
          echo "Discord sent"
