name: MIH 네이버 검색 노출 확인 (예비)

# 정규 스케줄은 Supabase pg_cron(mih-serp-check) → Vercel /api/cron/naver-search-screenshots 다
# (매일 00:30 UTC = 09:30 KST, mih_serp_checks 에 매일 기록되는 것으로 확인).
# 2026-09-10 에 이 워크플로로 옮기려 했지만 pg_cron 잡이 그대로 남아 있었고, 이 워크플로는
# npm ci(lock 파일 불일치)와 빠진 시크릿 때문에 한 번도 성공하지 못했다. 둘 다 돌면 기록과 알림이
# 두 번 나가므로 2026-10-05 부터 이 워크플로는 수동 실행 전용 예비 경로다(Vercel 이 막혔을 때).
#
# 알림은 Discord 대신 AIStudio 로 간다(repo secret AISTUDIO_NOTIFY_TOKEN, 토큰 label mih-github).
# test 를 켜면 검색·기록 없이 푸시 없는 [테스트] 알림 하나만 보낸다.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "다시 돌릴 날짜 (YYYY-MM-DD). 비우면 기본 대상일"
        required: false
      test:
        description: "연결 확인만 ([테스트] 알림 하나, 검색·기록 없음)"
        type: boolean
        default: false

jobs:
  serp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run serp:screenshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AISTUDIO_NOTIFY_TOKEN: ${{ secrets.AISTUDIO_NOTIFY_TOKEN }}
          SERP_DATE: ${{ inputs.date }}
          SERP_TEST: ${{ inputs.test && '1' || '' }}
